<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>神经重塑训练</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="portrait">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192x192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;background:#0a0a0a;min-height:100dvh;color:#fff;display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(100,80,200,0.12) 0%,transparent 70%);z-index:0}
.toast{position:fixed;top:16px;right:16px;background:rgba(26,26,46,0.95);border-radius:30px;padding:10px 20px;font-size:13px;opacity:0;transform:translateX(100%);transition:all .3s;backdrop-filter:blur(20px);z-index:1000;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(0)}
.toast.ok{border:1px solid #00c853;color:#00c853}
.toast.err{border:1px solid #ff6b6b;color:#ff6b6b}

.top-hint{margin-top:14px;font-size:11px;color:rgba(255,255,255,0.35);text-align:center;z-index:1}
.cover-wrap{position:relative;width:240px;height:240px;margin:18px auto 14px;z-index:1}
.cover-wrap img{width:100%;height:100%;object-fit:cover;border-radius:16px;animation:cg 4s ease-in-out infinite}
@keyframes cg{0%,100%{box-shadow:0 0 20px rgba(100,80,200,0.15),0 0 60px rgba(80,60,180,0.08)}50%{box-shadow:0 0 35px rgba(120,90,220,0.28),0 0 80px rgba(90,70,200,0.15)}}
.prog-ring{position:absolute;inset:-10px;pointer-events:none}
.prog-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.prog-ring circle{fill:none;stroke-width:3}
.prog-ring .bg{stroke:rgba(255,255,255,0.06)}
.prog-ring .bar{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .5s}

.song-info{text-align:center;padding:0 24px;z-index:1}
.song-info .title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.song-info .artist{font-size:13px;color:rgba(255,255,255,0.55);margin-top:5px}

.tbar{width:calc(100% - 48px);max-width:380px;margin:18px auto 12px;z-index:1}
.tbar-track{height:3px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;cursor:pointer;position:relative}
.tbar-fill{height:100%;width:0%;background:#fff;border-radius:3px;pointer-events:none;transition:width .1s}
.tbar-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.3);transition:left .1s}
.tbar-time{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.4);margin-top:7px;font-variant-numeric:tabular-nums}

.ctrls{display:flex;align-items:center;justify-content:center;gap:28px;padding:0 24px;z-index:1}
.ctrl-btn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;color:#fff;padding:0}
.ctrl-btn:active{transform:scale(.88);opacity:.7}
.ctrl-btn.play{width:64px;height:64px;background:#fff;color:#000}
.ctrl-btn.play svg{width:28px;height:28px}
.ctrl-btn svg{width:22px;height:22px}
.ctrl-btn.liked svg{fill:#00c853;stroke:#00c853}

.pills{display:flex;gap:8px;margin:16px 24px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:1}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:none;cursor:pointer;transition:all .2s}
.pill.on{background:rgba(255,255,255,0.12);color:#fff}

.toggle-more{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0;color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;z-index:1}
.panel{display:none;width:100%;max-width:420px;padding:0 16px;z-index:1}
.panel.open{display:block}

.stage-box{background:rgba(255,255,255,0.03);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.05)}
.stage-box .num{display:inline-block;background:linear-gradient(90deg,#00d4aa,#00a8e8);color:#000;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.stage-box .title{font-size:18px;margin:8px 0 4px;font-weight:700}
.stage-box .detail{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.6;white-space:pre-line}

.file-box{background:rgba(255,255,255,0.03);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.06)}
.f-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:12px;background:rgba(0,0,0,0.2);border-radius:12px;cursor:pointer}
.f-info{flex:1}.f-name{color:rgba(255,255,255,0.7);font-size:13px}.f-name.on{color:#00d4aa}
.f-meta{font-size:11px;color:rgba(255,255,255,0.35)}
.cfg-btn{padding:6px 14px;background:rgba(0,168,232,0.12);border:1px solid #00a8e8;border-radius:20px;color:#00a8e8;cursor:pointer;font-size:11px}

.vol-row{display:flex;align-items:center;gap:12px;margin:8px 0;padding:10px 14px;background:rgba(0,0,0,0.2);border-radius:12px}
.vol-row label{font-size:12px;color:rgba(255,255,255,0.6);width:60px}
.vol-row input[type="range"]{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;outline:none}
.vol-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#fff;border-radius:50%;cursor:pointer}
.vol-row .val{font-size:12px;color:#00d4aa;width:36px;text-align:right}

.btns{display:flex;gap:10px;margin-bottom:12px;justify-content:center}
.btn{padding:10px 24px;border-radius:24px;border:1px solid rgba(255,255,255,0.1);font-size:14px;font-weight:600;cursor:pointer;background:rgba(255,255,255,0.06);color:#fff}
.btn:active{transform:scale(.95)}
.btn-p{background:linear-gradient(135deg,#00d4aa,#00a8e8);color:#000;border:none}
.btn-d{background:rgba(255,107,107,0.12);border-color:#ff6b6b;color:#ff6b6b}

.playlist{margin-bottom:12px}
.track{display:flex;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:4px;background:rgba(255,255,255,0.02);cursor:pointer}
.track.on{background:rgba(0,212,170,0.1)}
.track .num{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-right:10px}
.track.on .num{background:#00d4aa;color:#000}
.track .info{flex:1}.track .info div{font-size:13px}

.stats{background:rgba(255,255,255,0.03);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.card{background:rgba(0,0,0,0.3);border-radius:12px;padding:14px 8px;text-align:center}
.card .val{font-size:28px;font-weight:700;color:#00d4aa}
.card .lbl{font-size:11px;color:rgba(255,255,255,0.35)}
.tabs{display:flex;gap:8px;margin-bottom:12px;justify-content:center}
.tab{padding:6px 16px;background:rgba(255,255,255,0.04);border-radius:20px;cursor:pointer;font-size:12px}
.tab.on{background:rgba(0,212,170,0.15);color:#00d4aa;font-weight:600}

.foot{background:rgba(255,255,255,0.03);border-radius:16px;padding:16px;margin-bottom:80px}
.toggle{position:relative;width:44px;height:26px;background:rgba(255,255,255,0.2);border-radius:26px;cursor:pointer}
.toggle.on{background:#00d4aa}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s}
.toggle.on::after{transform:translateX(18px)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;z-index:2000}
.modal.on{display:flex}
.modal-box{background:linear-gradient(135deg,#1e1e3a,#16213e);border-radius:20px;padding:24px;width:92%;max-width:400px;max-height:85dvh;overflow-y:auto;border:1px solid #00d4aa}
.p-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.p-row label{width:60px;font-size:12px;color:rgba(255,255,255,0.6)}
.p-row input{flex:1;padding:10px 12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:12px;font-size:14px;outline:none}
.modal-act{display:flex;gap:10px;margin-top:20px}

input[type="file"]{display:none}

@keyframes fIu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.a1{animation:fIu .5s ease-out .1s both}
.a2{animation:fIu .5s ease-out .2s both}
.a3{animation:fIu .5s ease-out .3s both}
.a4{animation:fIu .5s ease-out .4s both}
.a5{animation:fIu .5s ease-out .5s both}
@media(max-width:360px){.cover-wrap{width:200px;height:200px}.song-info .title{font-size:18px}}
</style>
</head>
<body>
<div class="toast ok" id="tOk"></div><div class="toast err" id="tErr"></div>
<p class="top-hint a1" id="hint">点击屏幕激活 · 通知栏控制可用</p>

<div class="cover-wrap a2">
<svg class="prog-ring" viewBox="0 0 260 260"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b7dd4"/><stop offset="100%" stop-color="#5b9bd5"/></linearGradient></defs><circle class="bg" cx="130" cy="130" r="125"/><circle class="bar" cx="130" cy="130" r="125" stroke-dasharray="785.4" stroke-dashoffset="785.4"/></svg>
<img src="./cover.jpg" alt="神经重塑" id="coverImg" draggable="false">
</div>

<div class="song-info a3">
<div class="title" id="stTitle">坐立战马</div>
<div class="artist" id="stSub">准备开始 · 阶段 <span id="stNum">1/5</span></div>
</div>

<div class="tbar a3">
<div class="tbar-track" id="tbar"><div class="tbar-fill" id="tFill" style="width:0%"></div><div class="tbar-dot" id="tDot" style="left:0%"></div></div>
<div class="tbar-time"><span id="tCur">00:00</span><span id="tDur">00:00</span></div>
</div>

<div class="ctrls a4">
<button class="ctrl-btn" id="likeBtn" title="收藏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
<button class="ctrl-btn" id="prevBtn" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
<button class="ctrl-btn play" id="playBtn" title="播放/暂停"><svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
<button class="ctrl-btn" id="nextBtn" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
<button class="ctrl-btn" id="hintBtn" title="想象提示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
</div>

<div class="pills a5" id="pills"></div>

<div class="toggle-more a5" onclick="document.getElementById('panel').classList.toggle('open');this.querySelector('span').textContent=document.getElementById('panel').classList.contains('open')?'▲':'▼'"><span>▼</span> 更多设置</div>

<div class="panel" id="panel">
<div class="stage-box"><span class="num" id="sNum">阶段 1/5</span><div class="title" id="sTitle">坐立战马</div><div class="detail" id="sDetail"></div></div>
<div class="file-box"><h4 style="color:rgba(255,255,255,0.6);margin-bottom:10px;font-size:12px">训练曲目</h4><div id="fRows"></div></div>
<div class="file-box"><h4 style="color:rgba(255,255,255,0.6);margin-bottom:8px;font-size:12px">音量</h4>
<div class="vol-row"><label>主音量</label><input type="range" id="mVol" min="0" max="100" value="80"><span class="val" id="mVolV">80%</span></div>
<div class="vol-row"><label>节拍器</label><input type="range" id="mtVol" min="0" max="100" value="30"><span class="val" id="mtVolV">30%</span></div>
</div>
<div class="btns"><button class="btn btn-p" id="resetBtn">↻ 重置</button><button class="btn" id="exportBtn">⬇ 导出</button></div>
<div class="playlist"><h3 style="color:rgba(255,255,255,0.6);margin-bottom:8px;font-size:12px">训练列表</h3><div id="plist"></div></div>
<div class="stats"><h4 style="color:rgba(255,255,255,0.6);margin-bottom:12px;font-size:13px">训练统计</h4>
<div class="grid"><div class="card"><div class="val" id="stSess">0</div><div class="lbl">完成次数</div></div><div class="card"><div class="val" id="stMin">0</div><div class="lbl">总分钟</div></div><div class="card"><div class="val" id="stStrk">0</div><div class="lbl">连续天数</div></div><div class="card"><div class="val" id="stLast">-</div><div class="lbl">上次</div></div></div>
<div class="tabs"><div class="tab on" data-t="w">本周</div><div class="tab" data-t="m">本月</div><div class="tab" data-t="y">全年</div></div>
<div style="height:160px"><canvas id="chart"></canvas></div>
</div>
<div class="foot"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="toggle on" id="autoSave"></div><span style="font-size:13px">自动保存</span></div><div style="display:flex;gap:10px"><button class="btn" id="importBtn" style="padding:8px 16px;font-size:12px;flex:1">📂 导入</button><button class="btn btn-d" id="clearBtn" style="padding:8px 16px;font-size:12px;flex:1">🗑 清除</button></div></div>
</div>

<input type="file" id="locFile" accept="audio/*">
<input type="file" id="impFile" accept=".json">

<div class="modal" id="cfgModal"><div class="modal-box">
<h3 id="cfgTitle">配置</h3>
<div class="p-row"><label>名称</label><input type="text" id="cName"></div>
<div class="p-row"><label>BPM</label><input type="number" id="cBpm" min="30" max="200"></div>
<div class="p-row"><label>时长(秒)</label><input type="number" id="cDur" min="0" max="7200"></div>
<div style="display:flex;gap:8px;margin:12px 0"><button class="btn" id="selLoc" style="padding:8px 12px;font-size:11px">📁 本地</button><button class="btn" id="selNet" style="padding:8px 12px;font-size:11px">🔗 链接</button></div>
<div class="modal-act"><button class="btn btn-p" id="saveCfg" style="flex:1">保存</button><button class="btn" id="canCfg" style="flex:1">取消</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const VER='8.0.0';
const toast=(id,msg,dur=2500)=>{const el=$(id);if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),dur)};
const ok=m=>toast('tOk','✓ '+m);const err=m=>toast('tErr','⚠ '+m);
const KEYS={ST:'nr_s8',DA:'nr_d8',AU:'nr_a8',ST2:'nr_r8'};
const DB={NAME:'NADB8',ST:'audio',V:1};
const DEF=[
{name:'坐立战马',bpm:72,dur:300,act:'坐位平衡，双手扶膝',img:'想象骑战马'},
{name:'飞檐走壁',bpm:108,dur:420,act:'站立位，重心左右移',img:'想象飞檐走壁'},
{name:'行云流水',bpm:66,dur:360,act:'慢步行走，摆臂自然',img:'想象行云流水'},
{name:'凌波微步',bpm:82,dur:360,act:'加快速度，小步跑',img:'想象凌波微步'},
{name:'脑体合一',bpm:60,dur:360,act:'站立深呼吸，闭眼',img:'想象脑体合一'}
];
const UA=navigator.userAgent.toLowerCase();
const isHw=/huawei|honor/.test(UA);
const isHm=/harmonyos|openharmony/.test(UA)||(isHw&&!/android/.test(UA));
const C2=785.4;

let stages=[...DEF.map(s=>({...s}))];
let cur=0,playing=false,total=0,saved=0;
let actx=null,curAud=null,auto=true;
let chart=null,chartT='w';
let meta=[null,null,null,null,null];
let stats={sessions:[],tSess:0,tMin:0,strk:0,last:null,daily:{}};
let eIdx=0,tFile=null,tUrl='';
let loop=null,mIv=null,mPr=null,mSt=0;
let bgO=null,bgG=null,wlock=null;
let mVol=.8,mtVol=.3;
let msOk=false,ntOk=false;
let liked=false;

// ===== IndexedDB =====
async function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB.NAME,DB.V);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(DB.ST))e.target.result.createObjectStore(DB.ST,{keyPath:'id'})}})}
async function dbPut(id,file){const db=await openDB();return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const tx=db.transaction([DB.ST],'readwrite');tx.objectStore(DB.ST).put({id,name:file.name,type:file.type,size:file.size,data:rd.result,ts:Date.now()});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)};rd.onerror=()=>rej(rd.error);rd.readAsArrayBuffer(file)})}
async function dbGet(id){try{const db=await openDB();return new Promise(res=>{const tx=db.transaction([DB.ST],'readonly');const r=tx.objectStore(DB.ST).get(id);r.onsuccess=()=>res(r.result||null)})}catch(e){return null}}
async function dbDel(id){try{const db=await openDB();return new Promise(r=>{const tx=db.transaction([DB.ST],'readwrite');tx.objectStore(DB.ST).delete(id);tx.oncomplete=()=>r()})}catch(e){}}

// ===== URL =====
const BASE=(()=>{let p=location.pathname;p=p.replace(/index\.html$/i,'');if(!p.endsWith('/'))p+='/';return location.origin+p})();
const iUrl=s=>BASE+'icons/icon-'+s+'x'+s+'.png';
const cUrl=()=>BASE+'cover.jpg';

// ===== Audio =====
async function eAC(){if(!actx||actx.state==='closed'){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('no wa');actx=new AC({latencyHint:'interactive',sampleRate:44100})}if(actx.state==='suspended')await actx.resume();return actx}
function fmt(s){if(!Number.isFinite(s)||s<0)s=0;const m=Math.floor(s/60),sc=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')}
function tDur(){return stages.reduce((a,s)=>a+(Number(s.dur)||0),0)}
function sStart(i){let t=0;for(let j=0;j<i;j++)t+=stages[j]?.dur||0;return t}

function stopAll(){stopBG();stopMt();if(curAud){try{curAud.pause();curAud.removeAttribute('src');curAud.load()}catch(e){}curAud=null}}
function stopBG(){try{bgO?.stop()}catch(e){}try{bgG?.disconnect()}catch(e){}bgO=null;bgG=null}
function stopMt(){if(mIv)clearInterval(mIv);mIv=null;if(mPr)clearInterval(mPr);mPr=null}

const SIL='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAA==';
function getSessAud(){const a=document.createElement('audio');a.crossOrigin='anonymous';a.setAttribute('playsinline','');a.controls=true;a.loop=true;a.muted=false;a.volume=0.3;a.preload='auto';a.style.cssText='position:fixed;bottom:0;left:0;width:100%;height:2px;opacity:0.01;pointer-events:none;z-index:9999';a.src=SIL;document.body.appendChild(a);return a}

function clkMt(){if(!actx||actx.state!=='running')return;try{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=1000;const n=actx.currentTime;g.gain.setValueAtTime(mtVol*0.5,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.08);o.start(n);o.stop(n+0.08)}catch(e){}}
function startMt(bpm){stopMt();const dur=stages[cur]?.dur||300;$('tDur').textContent=fmt(dur);$('tCur').textContent='00:00';$('tFill').style.width='0%';if($('tDot'))$('tDot').style.left='0%';mSt=performance.now();clkMt();mIv=setInterval(()=>{if(playing)clkMt()},(60/bpm)*1000);mPr=setInterval(()=>{if(!playing)return;const e=(performance.now()-mSt)/1000,p=Math.min((e/dur)*100,100);$('tFill').style.width=p+'%';if($('tDot'))$('tDot').style.left=p+'%';$('tCur').textContent=fmt(e);if(e>=dur){stopMt();nextSt()}},50)}

async function playMusic(idx,resume){stopAll();const m=meta[idx],s=stages[idx];if(m?.localFile){try{const entry=await dbGet(idx);if(entry?.data){const blob=new Blob([entry.data],{type:entry.type||'audio/mpeg'});curAud=new Audio(URL.createObjectURL(blob));curAud.loop=false;curAud.setAttribute('playsinline','');curAud.volume=mVol;curAud.addEventListener('timeupdate',()=>{if(!curAud?.duration)return;$('tFill').style.width=((curAud.currentTime/curAud.duration)*100)+'%';if($('tDot'))$('tDot').style.left=((curAud.currentTime/curAud.duration)*100)+'%';$('tCur').textContent=fmt(curAud.currentTime);$('tDur').textContent=fmt(curAud.duration)});curAud.addEventListener('ended',()=>{log('音频结束，自动跳转');nextSt()});return await dPlay(resume,s.name)}}catch(e){}}if(m?.onlineUrl){try{curAud=new Audio(m.onlineUrl);curAud.crossOrigin='anonymous';curAud.loop=false;curAud.setAttribute('playsinline','');curAud.volume=mVol;curAud.addEventListener('timeupdate',()=>{if(curAud?.duration){$('tFill').style.width=((curAud.currentTime/curAud.duration)*100)+'%';if($('tDot'))$('tDot').style.left=((curAud.currentTime/curAud.duration)*100)+'%';$('tCur').textContent=fmt(curAud.currentTime);$('tDur').textContent=fmt(curAud.duration)}});curAud.addEventListener('ended',()=>{log('音频结束，自动跳转');nextSt()});return await dPlay(resume,s.name)}catch(e){}}await mkBG(s);return false}
async function dPlay(resume,text){return new Promise(res=>{let done=false;const exec=async()=>{if(done)return;done=true;try{if(resume>0&&Number.isFinite(resume))curAud.currentTime=resume;await curAud.play();$('stSub').textContent=text;res(true)}catch(e){await mkBG(stages[cur]);res(false)}};exec();setTimeout(()=>{if(!done){done=true;mkBG(stages[cur]);res(false)}},5000)})}
async function mkBG(s){stopBG();try{const ctx=await eAC();bgO=ctx.createOscillator();bgG=ctx.createGain();bgO.connect(bgG);bgG.connect(ctx.destination);bgO.frequency.value=80;bgG.gain.value=mVol*0.03;bgO.start()}catch(e){}startMt(s.bpm);$('stSub').textContent=s.name+' · 节拍器'}

// ===== MediaSession + Notification =====
async function initMS(){if(!('mediaSession'in navigator))return;try{const acts=['play','pause','previoustrack','nexttrack','stop'];acts.forEach(a=>{try{navigator.mediaSession.setActionHandler(a,()=>hMS(a))}catch(e){}});await updMS();msOk=true}catch(e){}}
async function updMS(){if(!('mediaSession'in navigator))return;try{const s=stages[cur],m=meta[cur];navigator.mediaSession.metadata=new MediaMetadata({title:s?.name||'神经重塑',artist:m?.name||'训练播放',album:'阶段'+(cur+1)+'/5 · '+(s?.bpm||60)+'BPM',artwork:[{src:cUrl(),sizes:'512x512',type:'image/jpeg'},{src:iUrl(192),sizes:'192x192',type:'image/png'},{src:iUrl(128),sizes:'128x128',type:'image/png'},{src:iUrl(96),sizes:'96x96',type:'image/png'}]});navigator.mediaSession.playbackState=playing?'playing':'paused'}catch(e){}}
function hMS(a){switch(a){case'play':if(!playing)tog();break;case'pause':if(playing)pause();break;case'previoustrack':prev();break;case'nexttrack':next();break;case'stop':if(playing)pause();break}updMS();updNt()}

// ===== 华为兼容：Notification 通知栏控制 =====
async function initNt(){if(!('Notification'in window))return;if(Notification.permission!=='granted'&&Notification.permission!=='default')return;try{if(Notification.permission==='default')await Notification.requestPermission()}catch(e){}}
let ntTimer=null;
function updNt(){if(!ntOk||!playing){if(ntTimer){clearInterval(ntTimer);ntTimer=null}return}
const s=stages[cur];const title=s?.name||'神经重塑';const body='阶段 '+(cur+1)+'/5 · '+fmt(total)+' / '+fmt(tDur());
const icon=iUrl(192);
// 更新或创建通知
if('serviceWorker'in navigator&&navigator.serviceWorker.controller){navigator.serviceWorker.controller.postMessage({type:'MEDIA',title,body,icon,playing,cur})}else{showNt(title,body,icon)}}
function showNt(title,body,icon){try{const n=new Notification(title,{body,icon,tag:'nr-media',requireInteraction:true,actions:[{action:'prev',title:'⏮ 上一首'},{action:'toggle',title:playing?'⏸ 暂停':'▶ 播放'},{action:'next',title:'⏭ 下一首'}]});n.onclick=(e=>{e.notification.close();if(e.action==='prev')prev();else if(e.action==='next')next();else if(e.action==='toggle')tog();else{n.close()}})}catch(e){try{new Notification(title,{body,icon,tag:'nr-media',requireInteraction:true})}catch(e2){}}}
function startNtLoop(){if(ntTimer)clearInterval(ntTimer);ntTimer=setInterval(()=>{if(playing)updNt()},3000)}

// ===== 播放控制 =====
async function tog(){try{if(!actx)await eAC();playing?pause():playAll()}catch(e){err('播放失败')}}
async function playAll(){playing=true;updateBtn();const sa=getSessAud();sa.muted=false;sa.volume=0.3;sa.loop=true;sa.currentTime=0;try{await sa.play()}catch(e){}if(!msOk)await initMS();try{await playMusic(cur,saved)}catch(e){await mkBG(stages[cur])}await updMS();updNt();startNtLoop();loop=setInterval(()=>{if(!playing)return;total++;updateRing();if(total-sStart(cur)>=(stages[cur]?.dur||300))nextSt()},1000);reqWL()}
async function pause(){playing=false;updateBtn();if(loop)clearInterval(loop);if(ntTimer){clearInterval(ntTimer);ntTimer=null}if(curAud){saved=curAud.currentTime;curAud.pause()}stopMt();if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused';releaseWL();saveAll();await updMS()}
function nextSt(){if(cur<stages.length-1)switchT(cur+1);else complete()}
function complete(){pause();stopAll();cur=0;total=0;saved=0;updateRing();updateStage();updateBtn();$('stSub').textContent='准备开始';$('tFill').style.width='0%';if($('tDot'))$('tDot').style.left='0%';saveAll()}
function resetAll(){pause();stopAll();cur=0;total=0;saved=0;updateRing();updateStage();updateBtn();$('tFill').style.width='0%';if($('tDot'))$('tDot').style.left='0%';$('tCur').textContent='00:00';$('stSub').textContent='准备开始';saveAll()}
function switchT(i){if(i===cur&&!playing){tog();return}const was=playing;if(playing)pause();cur=i;saved=0;updateStage();if(was)setTimeout(()=>playAll(),150);else playMusic(cur).then(()=>{if(curAud&&!playing)curAud.pause()});saveAll()}
function prev(){switchT(cur>0?cur-1:stages.length-1)}
function next(){switchT(cur<stages.length-1?cur+1:0)}
function seek(e){if(!curAud?.duration)return;const rect=$('tbar').getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));curAud.currentTime=p*curAud.duration;saved=p*curAud.duration}

// ===== UI =====
function updateBtn(){const pi=$('iconPlay'),pa=$('iconPause');if(playing){if(pi)pi.style.display='none';if(pa)pa.style.display='block'}else{if(pi)pi.style.display='block';if(pa)pa.style.display='none'}}
function updateRing(){const td=tDur();if(td>0){const c=document.querySelector('.prog-ring .bar');if(c)c.style.strokeDashoffset=C2*(1-Math.min(total/td,1))}}
function updateStage(){const s=stages[cur];if(!s)return;$('stNum').textContent=(cur+1)+'/5';$('stTitle').textContent=s.name;if($('sNum'))$('sNum').textContent='阶段 '+(cur+1)+'/5';if($('sTitle'))$('sTitle').textContent=s.name;$('sDetail').textContent='动作：'+(s.act||'')+'\nBPM：'+s.bpm+'\n想象：'+(s.img||'');renderPills()}
function renderPills(){const c=$('pills');if(!c)return;c.innerHTML=stages.map((s,i)=>'<button class="pill '+(i===cur?'on':'')+'" data-i="'+i+'">'+s.name+'</button>').join('');c.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>switchT(+p.dataset.i)))}

// ===== 配置 =====
function openCfg(i){eIdx=i;const s=stages[i],m=meta[i];$('cfgTitle').textContent='⚙️ '+s.name;$('cName').value=s.name||'';$('cBpm').value=s.bpm||60;$('cDur').value=s.dur||300;tFile=null;tUrl='';window._dl=false;$('cfgModal').classList.add('on')}
function closeCfg(){$('cfgModal').classList.remove('on')}
async function saveCfg(){try{const old=stages[eIdx]||{};stages[eIdx]={name:($('cName').value||'').trim().substring(0,100)||old.name||('阶段'+(eIdx+1)),bpm:Math.max(30,Math.min(200,parseInt($('cBpm').value)||60)),dur:Math.max(0,Math.min(7200,parseInt($('cDur').value)||0)),act:old.act||'',img:old.img||''};if(tFile){try{await Promise.race([dbPut(eIdx,tFile),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);meta[eIdx]={...(meta[eIdx]||{}),name:stages[eIdx].name,localFile:{name:tFile.name,type:tFile.type,size:tFile.size}}}catch(dbErr){meta[eIdx]={...(meta[eIdx]||{}),name:stages[eIdx].name}}}else if(window._dl){try{await dbDel(eIdx)}catch(e){}if(meta[eIdx])meta[eIdx].localFile=null}if(tUrl){meta[eIdx]={...(meta[eIdx]||{}),onlineUrl:tUrl,onlineName:tUrl.split('/').pop()?.split('?')[0]||'在线'}}if(!meta[eIdx])meta[eIdx]={name:stages[eIdx].name,localFile:null,onlineUrl:'',onlineName:''};saveAll();renderRows();initPl();updateStage();updateRing();if(cur===eIdx&&playing)await playMusic(cur);closeCfg();ok('已保存')}catch(e){err('保存失败');setTimeout(closeCfg,1500)}}

// ===== 数据 =====
function saveAll(){if(!auto)return;try{localStorage.setItem(KEYS.ST,JSON.stringify(stages));localStorage.setItem(KEYS.DA,JSON.stringify({cur,total,saved,meta:meta.map(m=>m?{name:m.name,localFile:m.localFile?{name:m.localFile.name}:null,onlineUrl:m.onlineUrl||''}:null)}))}catch(e){}}
function loadAll(){try{const s=JSON.parse(localStorage.getItem(KEYS.ST));if(Array.isArray(s)&&s.length===5)stages=s.map((x,i)=>({...DEF[i],...x}))}catch(e){}try{const d=JSON.parse(localStorage.getItem(KEYS.DA));if(d){cur=d.cur||0;total=d.total||0;saved=d.saved||0;d.meta?.forEach((m,i)=>{if(m)meta[i]=m})}}catch(e){}try{stats=JSON.parse(localStorage.getItem(KEYS.ST2))||stats}catch(e){}auto=localStorage.getItem(KEYS.AU)!=='false'}

// ===== 导入导出 =====
function exportData(){try{const blob=new Blob([JSON.stringify({version:VER,stages,meta,stats,date:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='neuro_'+new Date().toISOString().split('T')[0]+'.json';a.click();ok('已导出')}catch(e){err('导出失败')}}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.stages){if(!Array.isArray(data.stages)||data.stages.length!==5){err('stages必须是5个');return}stages=data.stages}if(data.stats)stats=data.stats;if(data.meta)meta=data.meta;saveAll();renderRows();initPl();updateStage();updateRing();ok('导入成功')}catch(e){err('导入失败')}}
async function clearAll(){if(!confirm('确定清除所有数据？'))return;pause();stopAll();for(let i=0;i<5;i++)await dbDel(i);try{localStorage.clear()}catch(e){}stages=DEF.map(s=>({...s}));cur=0;total=0;saved=0;meta=[null,null,null,null,null];auto=true;stats={sessions:[],tSess:0,tMin:0,strk:0,last:null,daily:{}};try{localStorage.setItem(KEYS.AU,'true')}catch(e){}renderRows();initPl();updateStage();updateRing();$('stSub').textContent='准备开始';updateBtn();$('autoSave').classList.add('on');ok('已清除')}

// ===== Wake Lock =====
async function reqWL(){try{if('wakeLock'in navigator&&playing)wlock=await navigator.wakeLock.request('screen')}catch(e){}}
async function releaseWL(){if(wlock){try{await wlock.release()}catch(e){}wlock=null}}

// ===== 列表 =====
function initPl(){const c=$('plist');if(!c)return;c.innerHTML=stages.map((s,i)=>{const m=meta[i];let d='节拍器';if(m?.localFile)d='📁本地';else if(m?.onlineUrl)d='🌐链接';return'<div class="track '+(i===cur?'on':'')+'" data-i="'+i+'"><div class="num">'+(i+1)+'</div><div class="info"><div>'+s.name+'</div><small style="color:rgba(255,255,255,0.35)">'+s.bpm+'BPM · '+fmt(s.dur)+' · '+d+'</small></div></div>'}).join('');c.querySelectorAll('.track').forEach(t=>t.addEventListener('click',()=>switchT(+t.dataset.i)))}
function renderRows(){const c=$('fRows');if(!c)return;c.innerHTML=stages.map((s,i)=>{const m=meta[i];let dn=(i+1)+'. '+s.name,mt='未设置音乐';if(m&&(m.localFile||m.onlineUrl)){dn=(i+1)+'. '+(m.name||s.name);mt=(m.localFile?'📁':'')+(m.onlineUrl?'🌐':'')+' · '+fmt(s.dur)}return'<div class="f-row"><div class="f-info"><div class="f-name '+(m?.localFile||m?.onlineUrl?'on':'')+'">'+dn+'</div><div class="f-meta">'+mt+'</div></div><button class="cfg-btn" data-s="'+i+'">⚙️</button></div>'}).join('');c.querySelectorAll('.cfg-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openCfg(+b.dataset.s)}))}

// ===== 图表 =====
function initChart(){const c=$('chart');if(!c||!window.Chart)return;chart=new Chart(c.getContext('2d'),{type:'bar',data:getCData('w'),options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}})}
function getCData(t){const lb=[],da=[],now=new Date;if(t==='w'){for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);lb.push(d.toLocaleDateString('zh-CN',{weekday:'short'}));da.push(stats.daily[d.toISOString().split('T')[0]]||0)}}else if(t==='m'){for(let i=3;i>=0;i--){const e=new Date(now);e.setDate(e.getDate()-i*7);const s=new Date(e);s.setDate(s.getDate()-6);let c=0;for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))c+=stats.daily[d.toISOString().split('T')[0]]||0;lb.push((s.getMonth()+1)+'/'+s.getDate());da.push(c)}}else{for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);let c=0;for(let day=1;day<=31;day++)c+=stats.daily[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')]||0;lb.push((d.getMonth()+1)+'月');da.push(c)}}return{labels:lb,datasets:[{data:da,backgroundColor:'#00d4aa',borderRadius:6}]}}
function switchC(t){chartT=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));if(chart){chart.data=getCData(t);chart.update()}}

// ===== 事件绑定 =====
function bind(){
$('playBtn').addEventListener('click',tog);
$('resetBtn').addEventListener('click',resetAll);
$('exportBtn').addEventListener('click',exportData);
$('importBtn').addEventListener('click',()=>$('impFile').click());
$('clearBtn').addEventListener('click',clearAll);
$('prevBtn').addEventListener('click',prev);
$('nextBtn').addEventListener('click',next);
$('likeBtn').addEventListener('click',()=>{liked=!liked;$('likeBtn').classList.toggle('liked',liked);ok(liked?'已收藏':'已取消')});
$('hintBtn').addEventListener('click',()=>{const s=stages[cur];ok(s?.img||'深呼吸，专注当下')});
$('tbar').addEventListener('click',seek);
$('cfgModal').addEventListener('click',e=>{if(e.target===$('cfgModal'))closeCfg()});
$('saveCfg').addEventListener('click',saveCfg);
$('canCfg').addEventListener('click',closeCfg);
$('selLoc').addEventListener('click',()=>$('locFile').click());
$('selNet').addEventListener('click',()=>{const u=prompt('音频链接:');if(u){const m=u.match(/https?:\/\/[^\s"'<>]+/g);if(m)tUrl=m[0];else err('无效链接')}});
$('locFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('audio/')){err('请选择音频');e.target.value='';return}tFile=f;tUrl='';ok('已选: '+f.name);e.target.value=''});
$('impFile').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchC(t.dataset.t)));
$('autoSave').addEventListener('click',()=>{auto=!auto;try{localStorage.setItem(KEYS.AU,String(auto))}catch(e){}$('autoSave').classList.toggle('on',auto);if(auto)saveAll()});
$('mVol').addEventListener('input',e=>{mVol=e.target.value/100;$('mVolV').textContent=e.target.value+'%';if(curAud)curAud.volume=mVol});
$('mtVol').addEventListener('input',e=>{mtVol=e.target.value/100;$('mtVolV').textContent=e.target.value+'%'});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();tog()}else if(e.code==='ArrowLeft'){e.preventDefault();prev()}else if(e.code==='ArrowRight'){e.preventDefault();next()}});
}

// ===== 初始化 =====
async function init(){
loadAll();
$('autoSave').classList.toggle('on',auto);
renderRows();initPl();updateStage();updateRing();updateBtn();
initChart();switchC('w');
bind();

// 激活：用户手势后才能启动音频
const activate=async()=>{
await eAC();
getSessAud();
await initMS();
await initNt();
// 预加载图片
[cUrl(),iUrl(96),iUrl(128),iUrl(192)].forEach(url=>{const img=new Image();img.src=url});
await updMS();
document.removeEventListener('touchstart',activate);
document.removeEventListener('click',activate);
};
document.addEventListener('touchstart',activate,{once:true,passive:true});
document.addEventListener('click',activate,{once:true,passive:true});

// 通知权限请求
try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().then(p=>{if(p==='granted'){ntOk=true;ok('通知权限已授权')}})}catch(e){}

// Service Worker（用于 Notification）
if('serviceWorker'in navigator){
navigator.serviceWorker.register('./sw.js').then(reg=>{
// 监听来自 SW 的消息
navigator.serviceWorker.addEventListener('message',e=>{
if(e.data&&e.data.type==='ACTION'){
if(e.data.action==='prev')prev();
else if(e.data.action==='next')next();
else if(e.data.action==='toggle')tog();
}
});
}).catch(()=>{});
}

// 定期检查通知
setInterval(()=>{if(playing&&ntOk)updNt()},5000);
setInterval(()=>{if(auto&&playing)saveAll()},15000);
window.addEventListener('beforeunload',()=>{if(auto)saveAll()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
</body>
